
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-portal
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: event-portal

  template:
    metadata:
      labels:
        app: event-portal

    spec:
      containers:
        - name: event-portal
          image: kavipriya1928/event-portal:latest
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
